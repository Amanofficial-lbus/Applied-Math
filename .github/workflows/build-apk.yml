name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type to Generate'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK 36.1 and Pre-Accept Licenses
        run: |
          echo "Configuring Android SDK licenses..."
          sudo mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          echo "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-preview-license" > /dev/null
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" | sudo tee -a "$ANDROID_HOME/licenses/android-googletv-license" > /dev/null
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" | sudo tee -a "$ANDROID_HOME/licenses/google-gdk-license" > /dev/null
          echo "e9acab5b5fbb560a72cfaecce8946896ff6aab9d" | sudo tee -a "$ANDROID_HOME/licenses/mips-android-sysimage-license" > /dev/null

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager at: $SDKMANAGER"
            yes | sudo "$SDKMANAGER" --licenses 2>/dev/null || true
            echo "Installing platforms;android-36.1 and platforms;android-36..."
            sudo "$SDKMANAGER" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true
          fi

          echo "Ensuring runner user ownership of Android SDK..."
          sudo chown -R $USER:$USER "$ANDROID_HOME"

      - name: Prepare Secrets and Environment Configuration
        run: |
          echo "Setting up .env file from .env.example..."
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Build Debug APK with Memory Control
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m" \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.parallel=false

      - name: Verify Debug APK
        run: |
          echo "Checking generated APK files:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: applied-math-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
