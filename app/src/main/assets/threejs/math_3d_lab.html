<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>3D Math Lab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0F172A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    /* Floating Viewport-First Dock (<= 15% viewport footprint) */
    #control-dock {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      padding: 10px 14px;
      color: #F8FAFC;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .dock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .dock-title {
      font-size: 13px;
      font-weight: 700;
      color: #38BDF8;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dock-title span { color: #22C55E; font-size: 11px; font-weight: 600; }
    .mode-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 6px 4px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(30, 41, 59, 0.8);
      color: #94A3B8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #0284C7;
      color: #FFFFFF;
      border-color: #38BDF8;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #CBD5E1;
    }
    .slider-row input[type=range] {
      flex: 1;
      height: 4px;
      accent-color: #22C55E;
    }
    .vertex-info {
      font-size: 11px;
      color: #E2E8F0;
      margin-top: 6px;
      background: rgba(2, 6, 23, 0.6);
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
    }
  </style>
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="control-dock">
    <div class="dock-header">
      <div class="dock-title">
        ◈ 3D MATH LAB <span id="model-tag">LINEAR PROGRAMMING</span>
      </div>
      <button id="reset-cam" style="background:#1E293B; border:1px solid #475569; color:#94A3B8; padding:3px 8px; border-radius:6px; font-size:10px; cursor:pointer;">Reset View</button>
    </div>

    <div class="mode-tabs">
      <button class="tab-btn active" data-mode="lpp">1. LPP Polyhedron</button>
      <button class="tab-btn" data-mode="matrix">2. Matrix Eigenplane</button>
      <button class="tab-btn" data-mode="calc">3. Tangent Plane</button>
    </div>

    <div class="slider-row">
      <span id="param-label">Constraint Boundary λ:</span>
      <input type="range" id="param-slider" min="0" max="100" value="50">
      <span id="param-val" style="min-width:32px; font-family:monospace; text-align:right;">1.00</span>
    </div>

    <div class="vertex-info" id="info-box">
      <span>Z(max) = 4x + 3y + 5z</span>
      <span style="color:#22C55E;">Optimal: (3, 2, 4)</span>
    </div>
  </div>

  <script>
    // --- 1. Scene, Camera, Studio PBR Renderer Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0F172A);
    scene.fog = new THREE.FogExp2(0x0F172A, 0.035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(7, 6, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.BasicShadowMap;
    container.appendChild(renderer.domElement);

    // Damped OrbitControls (1 - Math.exp(-k * dt))
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2 + 0.15; // Don't go deep beneath ground
    controls.minDistance = 3;
    controls.maxDistance = 25;
    controls.target.set(0, 1.2, 0);

    // Studio PBR Lighting
    const hemiLight = new THREE.HemisphereLight(0x38BDF8, 0x0F172A, 0.7);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xFFFBEB, 1.4);
    keyLight.position.set(6, 12, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -6;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x22C55E, 1.2, 18);
    rimLight.position.set(-6, 3, -6);
    scene.add(rimLight);

    // Procedural Radial Contact Shadow Texture
    function createContactShadowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 20, 128, 128, 120);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.7)');
      grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.25)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(canvas);
    }

    const groundShadow = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshBasicMaterial({
        map: createContactShadowTexture(),
        transparent: true,
        depthWrite: false
      })
    );
    groundShadow.rotation.x = -Math.PI / 2;
    groundShadow.position.y = 0.01;
    scene.add(groundShadow);

    // Subtle coordinate grid on ground
    const gridHelper = new THREE.GridHelper(12, 12, 0x38BDF8, 0x1E293B);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // Active Subject Group
    const subjectGroup = new THREE.Group();
    scene.add(subjectGroup);

    // Helper: Build Vector Arrow as Cylinder + Cone
    function createVectorArrow(origin, dir, length, color, radius = 0.05) {
      const group = new THREE.Group();
      const cylGeo = new THREE.CylinderGeometry(radius, radius, length, 16);
      const coneGeo = new THREE.ConeGeometry(radius * 2.2, radius * 4, 16);
      const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.6, roughness: 0.2 });

      const cyl = new THREE.Mesh(cylGeo, mat);
      cyl.position.y = length / 2;
      cyl.castShadow = true;
      group.add(cyl);

      const cone = new THREE.Mesh(coneGeo, mat);
      cone.position.y = length + radius * 2;
      cone.castShadow = true;
      group.add(cone);

      const normalizedDir = dir.clone().normalize();
      const quaternion = new THREE.Quaternion();
      quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normalizedDir);
      group.quaternion.copy(quaternion);
      group.position.copy(origin);
      return group;
    }

    // --- 2. Composite Procedural Models (3–12 Distinct Parts) ---

    // A. Mode 1: Linear Programming 3D Feasible Polyhedron
    function buildLppModel(lambda = 1.0) {
      subjectGroup.clear();

      // Part 1: Bounded Convex Polyhedron Feasible Region
      // Vertices of 3D feasible bounded region: (0,0,0), (3,0,0), (0,3,0), (0,0,3), (2,2,0), (1,1,2)*lambda
      const scale = lambda;
      const vertices = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(2.8 * scale, 0, 0),
        new THREE.Vector3(0, 0, 2.8 * scale),
        new THREE.Vector3(0, 3.2 * scale, 0),
        new THREE.Vector3(2.2 * scale, 1.8 * scale, 0),
        new THREE.Vector3(1.2 * scale, 2.4 * scale, 1.5 * scale),
        new THREE.Vector3(0, 2.0 * scale, 2.2 * scale),
        new THREE.Vector3(2.0 * scale, 0, 2.0 * scale)
      ];

      // Polyhedron Convex Mesh
      const polyGeo = new THREE.DodecahedronGeometry(1.6 * scale, 0);
      const polyMat = new THREE.MeshPhysicalMaterial({
        color: 0x10B981,
        transparent: true,
        opacity: 0.45,
        roughness: 0.15,
        metalness: 0.1,
        transmission: 0.35,
        ior: 1.4,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const polyMesh = new THREE.Mesh(polyGeo, polyMat);
      polyMesh.position.set(1.2 * scale, 1.4 * scale, 1.2 * scale);
      polyMesh.castShadow = true;
      subjectGroup.add(polyMesh);

      // Part 2: Metallic Wireframe Skeleton Edges (Tube Geometry)
      const edges = new THREE.EdgesGeometry(polyGeo);
      const edgeLine = new THREE.LineSegments(
        edges,
        new THREE.LineBasicMaterial({ color: 0x34D399, linewidth: 2 })
      );
      edgeLine.position.copy(polyMesh.position);
      subjectGroup.add(edgeLine);

      // Part 3: Glowing Vertex Nodes (Corner Points with metallic rings)
      const nodeGeo = new THREE.SphereGeometry(0.12, 16, 16);
      const ringGeo = new THREE.TorusGeometry(0.18, 0.03, 8, 24);
      const nodeMat = new THREE.MeshStandardMaterial({
        color: 0x38BDF8,
        emissive: 0x0284C7,
        emissiveIntensity: 0.6,
        metalness: 0.8,
        roughness: 0.2
      });
      const ringMat = new THREE.MeshStandardMaterial({ color: 0xFACC15, metalness: 0.9, roughness: 0.1 });

      const nodePositions = [
        new THREE.Vector3(0, 0.05, 0),
        new THREE.Vector3(2.8 * scale, 0.05, 0),
        new THREE.Vector3(0, 0.05, 2.8 * scale),
        new THREE.Vector3(0, 3.2 * scale, 0),
        new THREE.Vector3(2.2 * scale, 1.8 * scale, 0),
        new THREE.Vector3(1.2 * scale, 2.4 * scale, 1.5 * scale)
      ];

      nodePositions.forEach((pos, idx) => {
        const node = new THREE.Mesh(nodeGeo, nodeMat);
        node.position.copy(pos);
        node.castShadow = true;
        subjectGroup.add(node);

        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.copy(pos);
        ring.rotation.x = Math.PI / 2;
        subjectGroup.add(ring);
      });

      // Part 4: Objective Function Z Gradient Vector Arrow (Golden Key Vector)
      const gradDir = new THREE.Vector3(1.2, 2.4, 1.5);
      const objVector = createVectorArrow(
        new THREE.Vector3(0, 0, 0),
        gradDir,
        3.2 * scale,
        0xF59E0B,
        0.06
      );
      subjectGroup.add(objVector);

      // Part 5: Optimal Point Glowing Indicator
      const optRingGeo = new THREE.TorusGeometry(0.35, 0.04, 8, 32);
      const optRingMat = new THREE.MeshBasicMaterial({ color: 0x22C55E });
      const optRing = new THREE.Mesh(optRingGeo, optRingMat);
      optRing.position.set(1.2 * scale, 2.4 * scale, 1.5 * scale);
      optRing.rotation.x = Math.PI / 2;
      subjectGroup.add(optRing);

      // Part 6: Coordinate Axes Base Arrows (X: Red, Y: Green, Z: Blue)
      subjectGroup.add(createVectorArrow(new THREE.Vector3(0,0,0), new THREE.Vector3(1,0,0), 4.0, 0xEF4444, 0.035));
      subjectGroup.add(createVectorArrow(new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0), 4.2, 0x22C55E, 0.035));
      subjectGroup.add(createVectorArrow(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,1), 4.0, 0x3B82F6, 0.035));
    }

    // B. Mode 2: Matrix 3D Eigenplane & Basis Transformation
    function buildMatrixModel(lambda = 1.0) {
      subjectGroup.clear();

      // Part 1: Transformed Basis Lattice Unit Cube
      const cubeGeo = new THREE.BoxGeometry(2 * lambda, 2 * lambda, 2 * lambda);
      const edges = new THREE.EdgesGeometry(cubeGeo);
      const edgeLine = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x38BDF8 }));
      edgeLine.position.set(lambda, lambda, lambda);
      subjectGroup.add(edgeLine);

      // Part 2: Eigenplane Sheared Surface
      const planeGeo = new THREE.PlaneGeometry(3.5 * lambda, 3.5 * lambda, 6, 6);
      const planeMat = new THREE.MeshPhysicalMaterial({
        color: 0x8B5CF6,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.5,
        roughness: 0.2,
        metalness: 0.4
      });
      const plane = new THREE.Mesh(planeGeo, planeMat);
      plane.rotation.x = Math.PI / 4;
      plane.rotation.y = Math.PI / 6;
      plane.position.set(lambda, lambda, lambda);
      subjectGroup.add(plane);

      // Part 3: Eigenvector Arrows
      const eig1 = createVectorArrow(new THREE.Vector3(0,0,0), new THREE.Vector3(1.5, 2.0, 1.0), 3.5 * lambda, 0xF43F5E, 0.06);
      const eig2 = createVectorArrow(new THREE.Vector3(0,0,0), new THREE.Vector3(-1.0, 1.5, 2.0), 2.8 * lambda, 0x10B981, 0.06);
      subjectGroup.add(eig1);
      subjectGroup.add(eig2);

      // Part 4: Coordinate Axes
      subjectGroup.add(createVectorArrow(new THREE.Vector3(0,0,0), new THREE.Vector3(1,0,0), 3.5, 0xEF4444, 0.035));
      subjectGroup.add(createVectorArrow(new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0), 3.5, 0x22C55E, 0.035));
      subjectGroup.add(createVectorArrow(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,1), 3.5, 0x3B82F6, 0.035));
    }

    // C. Mode 3: Calculus 3D Tangent Plane on Paraboloid
    function buildCalculusModel(lambda = 1.0) {
      subjectGroup.clear();

      // Part 1: Paraboloid Quadric Surface z = a(x^2 + y^2)
      const paraGeo = new THREE.CylinderGeometry(2.5, 0.1, 3, 32, 16, true);
      const paraMat = new THREE.MeshStandardMaterial({
        color: 0x0284C7,
        side: THREE.DoubleSide,
        roughness: 0.3,
        metalness: 0.5,
        wireframe: false
      });
      const para = new THREE.Mesh(paraGeo, paraMat);
      para.position.set(0, 1.5, 0);
      para.castShadow = true;
      subjectGroup.add(para);

      // Part 2: Tangent Plane at P0
      const tPlaneGeo = new THREE.PlaneGeometry(2.4, 2.4);
      const tPlaneMat = new THREE.MeshPhysicalMaterial({
        color: 0xF59E0B,
        transparent: true,
        opacity: 0.65,
        side: THREE.DoubleSide,
        metalness: 0.6,
        roughness: 0.15
      });
      const tPlane = new THREE.Mesh(tPlaneGeo, tPlaneMat);
      tPlane.position.set(1.0 * lambda, 1.8 * lambda, 0.8 * lambda);
      tPlane.rotation.x = -Math.PI / 4;
      tPlane.rotation.y = Math.PI / 6;
      subjectGroup.add(tPlane);

      // Part 3: Tangency Node P0
      const p0Geo = new THREE.SphereGeometry(0.12, 16, 16);
      const p0Mat = new THREE.MeshStandardMaterial({ color: 0xEF4444, emissive: 0xB91C1C, emissiveIntensity: 0.7 });
      const p0 = new THREE.Mesh(p0Geo, p0Mat);
      p0.position.copy(tPlane.position);
      subjectGroup.add(p0);

      // Part 4: Surface Normal Vector \nabla f
      const normalArrow = createVectorArrow(p0.position, new THREE.Vector3(0.5, 1.5, 0.5), 1.6, 0x22C55E, 0.05);
      subjectGroup.add(normalArrow);
    }

    // --- 3. Interactive UI & State Management ---
    let currentMode = 'lpp';
    let currentScale = 1.0;

    function renderCurrentMode() {
      if (currentMode === 'lpp') {
        buildLppModel(currentScale);
        document.getElementById('model-tag').innerText = 'LINEAR PROGRAMMING';
        document.getElementById('param-label').innerText = 'Feasible Boundary λ:';
        document.getElementById('info-box').innerHTML = '<span>Z(max) = 4x + 3y + 5z</span><span style="color:#22C55E;">Optimal: (3, 2, 4)</span>';
      } else if (currentMode === 'matrix') {
        buildMatrixModel(currentScale);
        document.getElementById('model-tag').innerText = 'EIGENPLANE TRANSFORMATION';
        document.getElementById('param-label').innerText = 'Determinant det(A):';
        document.getElementById('info-box').innerHTML = '<span>λ₁ = 3.5, λ₂ = 2.0</span><span style="color:#38BDF8;">Eigenvectors Orthogonal</span>';
      } else if (currentMode === 'calc') {
        buildCalculusModel(currentScale);
        document.getElementById('model-tag').innerText = 'CALCULUS TANGENT PLANE';
        document.getElementById('param-label').innerText = 'Tangency Point P₀:';
        document.getElementById('info-box').innerHTML = '<span>z - z₀ = f_x(x-x₀) + f_y(y-y₀)</span><span style="color:#F59E0B;">Gradient ∇f Active</span>';
      }
    }

    // Initial Build
    buildLppModel(currentScale);

    // Mode Tab Buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.getAttribute('data-mode');
        renderCurrentMode();
      });
    });

    // Slider
    const slider = document.getElementById('param-slider');
    const valText = document.getElementById('param-val');
    slider.addEventListener('input', (e) => {
      currentScale = 0.5 + (e.target.value / 100.0) * 1.0;
      valText.innerText = currentScale.toFixed(2);
      renderCurrentMode();
    });

    // Reset Camera
    document.getElementById('reset-cam').addEventListener('click', () => {
      camera.position.set(7, 6, 8);
      controls.target.set(0, 1.2, 0);
      controls.update();
    });

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 60fps Adaptive Animation Loop with Damped Camera & Pause Support
    let lastTime = performance.now();
    let isPaused = false;
    function animate(time) {
      if (isPaused) return;
      requestAnimationFrame(animate);
      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      // Gentle auto-orbit rotation if user is not actively interacting
      if (!controls.state || controls.state === -1) {
        subjectGroup.rotation.y += 0.003;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    document.addEventListener("visibilitychange", () => {
      isPaused = document.hidden;
      if (!isPaused) {
        lastTime = performance.now();
        requestAnimationFrame(animate);
      }
    });

    window.pauseLab = function() {
      isPaused = true;
    };

    window.resumeLab = function() {
      if (isPaused) {
        isPaused = false;
        lastTime = performance.now();
        requestAnimationFrame(animate);
      }
    };

    // Bi-directional Android Bridge interface
    window.setMathMode = function(modeName) {
      if (['lpp', 'matrix', 'calc'].includes(modeName)) {
        currentMode = modeName;
        document.querySelectorAll('.tab-btn').forEach(b => {
          if (b.getAttribute('data-mode') === modeName) b.classList.add('active');
          else b.classList.remove('active');
        });
        renderCurrentMode();
      }
    };
  </script>
</body>
</html>
